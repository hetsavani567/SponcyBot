<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Inner subtle ring -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#34d399" stroke-width="0.75" stroke-opacity="0.25"/>
  <!-- Stylized Lightning / Sponcy Bolt -->
  <path d="M35 8 L18 34 L31 34 L27 56 L47 26 L34 26 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
  <!-- Sparkle dot -->
  <circle cx="47" cy="17" r="2.5" fill="#6ee7b7"/>
  <circle cx="17" cy="46" r="1.5" fill="#34d399" opacity="0.8"/>
</svg>
